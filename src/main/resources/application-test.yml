server:
  port: ${SERVER_PORT:0}

spring:
  config:
    activate:
      on-profile: test
  datasource:
    url: ${TEST_DATABASE_URL:${DATABASE_URL:jdbc:postgresql://localhost:5432/mto_field_test}}
    username: ${TEST_DATABASE_USERNAME:${DATABASE_USERNAME:}}
    password: ${TEST_DATABASE_PASSWORD:${DATABASE_PASSWORD:}}
    driver-class-name: org.postgresql.Driver
  flyway:
    enabled: ${SPRING_FLYWAY_ENABLED:true}
    locations: ${SPRING_FLYWAY_LOCATIONS:classpath:db/migration}
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    show-sql: false
  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: ${KEYCLOAK_ISSUER_URI:http://localhost:8082/realms/mto}
  grpc:
    server:
      port: ${SPRING_GRPC_SERVER_PORT:0}

app:
  security:
    audience-validation-enabled: ${KEYCLOAK_AUDIENCE_VALIDATION_ENABLED:false}
  field:
    board:
      tick: 1s
  maintenance:
    enabled: ${APP_MAINTENANCE_ENABLED:false}
    sync-retry:
      enabled: ${APP_MAINTENANCE_SYNC_RETRY_ENABLED:false}

management:
  endpoint:
    health:
      show-details: ${MANAGEMENT_ENDPOINT_HEALTH_SHOW_DETAILS:always}

logging:
  level:
    root: ${LOGGING_LEVEL_ROOT:WARN}
    com.alejandro.mtofield: ${LOGGING_LEVEL_APP:INFO}
